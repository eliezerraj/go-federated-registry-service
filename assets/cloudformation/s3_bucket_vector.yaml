AWSTemplateFormatVersion: '2010-09-09'
Description: Create an Amazon S3 Vector Bucket and Vector Index

Parameters:
  Environment:
    Type: String
    Default: dev
    Description: Environment name.

  BusinessModel:
    Type: String
    Default: shared

  BusinessUnit:
    Type: String
    Default: shared

  Customer:
    Type: String
    Default: architecture

  Application:
    Type: String
    Default: architecture

  ProjectName:
    Type: String
    Default: ecommerce-architecture

  VectorBucketName:
    Type: String
    Default: 908671954593-dev-s3-vector
    
  IndexName:
    Type: String
    Default: s3-vector-index-service-discovery

Resources:

  S3VectorBucket:
    Type: AWS::S3Vectors::VectorBucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VectorBucketName: !Ref VectorBucketName
      Encryption:
        EncryptionType: SSE-S3

      Tags:
        - Key: Name
          Value: !Sub "${Application}-${Environment}-vector"

        - Key: business_model
          Value: !Ref BusinessModel

        - Key: business_unit
          Value: !Ref BusinessUnit

        - Key: customer
          Value: !Ref Customerhses

        - Key: application
          Value: !Ref Application

        - Key: env
          Value: !Ref Environment

        - Key: project
          Value: !Ref ProjectName

        - Key: stack
          Value: !Ref AWS::StackName

  S3VectorBucketIndex:
    Type: AWS::S3Vectors::Index
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VectorBucketName: !Ref VectorBucketName
      IndexName: !Ref IndexName

      MetadataConfiguration:
        FilterableMetadataKeywords:
          - tenant
          - service
          - region
          - language

        NonFilterableMetadataKeywords:
          - source
          - chunk
          - temporary_tag

  S3VectorsAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ProjectName}-${Environment}-s3vectors-policy"
      Description: Access policy for Amazon S3 Vectors
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: VectorBucketAccess
            Effect: Allow
            Action:
              - s3vectors:GetVectorBucket
              - s3vectors:ListIndexes
              - s3vectors:CreateIndex
              - s3vectors:DeleteIndex
            Resource:
              - !GetAtt S3VectorBucket.Arn
          - Sid: VectorIndexAccess
            Effect: Allow
            Action:
              - s3vectors:GetIndex
              - s3vectors:PutVectors
              - s3vectors:GetVectors
              - s3vectors:DeleteVectors
              - s3vectors:QueryVectors
              - s3vectors:ListVectors
            Resource:
              - !GetAtt S3VectorBucketIndex.Arn

Outputs:
  VectorBucketName:
    Description: S3 Vector Bucket name
    Value: !Ref VectorBucketName
    Export:
      Name: !Sub "${AWS::StackName}-VectorBucketName"

  VectorBucketArn:
    Description: S3 Vector Bucket ARN
    Value: !GetAtt S3VectorBucket.Arn
    Export:
      Name: !Sub "${AWS::StackName}-VectorBucketArn"

  VectorIndexName:
    Description: Vector Index name
    Value: !Ref S3VectorBucketIndex
    Export:
      Name: !Sub "${AWS::StackName}-VectorIndexName"

  VectorIndexArn:
    Description: Vector Index ARN
    Value: !GetAtt S3VectorBucketIndex.Arn
    Export:
      Name: !Sub "${AWS::StackName}-VectorIndexArn"